<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WarGrid</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ui">
    <h1>WarGrid</h1>
    <div id="stats">
      <span>Золото: <b id="gold">0</b></span>
      <span>Пехота: <b id="troops">0</b></span>
    </div>
    <div id="controls">
      <button id="buyBtn">Купить пехоту (50)</button>
      <button id="justifyBtn" disabled>Оправдать войну</button>
    </div>
    <div id="status">Выбери клетку врага на границе и оправдай войну.</div>
  </div>

  <canvas id="map"></canvas>

  <!-- VK Bridge: обязательно для запуска в ВК -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <script>
    if (window.vkBridge) { vkBridge.send('VKWebAppInit', {}); }
  </script>
  <script src="game.js"></script>
</body>
</html>
